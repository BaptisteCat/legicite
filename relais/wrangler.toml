# Relais d'authentification PISTE — configuration Cloudflare Worker.
#
# Ce dossier est VOLONTAIREMENT isolé du reste du dépôt : il n'a aucune
# dépendance, alors que l'extension en a de lourdes (sharp, fontkit) qui
# n'auraient rien à faire dans un build de Worker.
#
# Dans Cloudflare, régler la compilation du Worker ainsi :
#
#   Répertoire racine  : relais
#   Commande de build  : (laisser vide)
#   Commande de deploy : npx wrangler deploy
#
# Le nom ci-dessous détermine celui du Worker, donc son adresse :
#   https://legicite-relais.VOTRE-SOUS-DOMAINE.workers.dev

name = "legicite-relais"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Aucun secret, aucune variable : le relais ne fait que transmettre.
# Les origines admises sont dans src/index.js, en clair et versionnées.
