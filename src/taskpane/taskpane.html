<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LégiCite</title>

    <!-- Ordre imposé par la charte : jetons, puis coquille, puis feuille propre. -->
    <link rel="stylesheet" href="juritel-design.css" />
    <link rel="stylesheet" href="addin.css" />
    <link rel="stylesheet" href="legicite.css" />

    <!--
      Office.js doit imperativement etre charge depuis le CDN Microsoft, non
      versionne et mis a jour en continu : c'est la seule methode supportee.
      Un attribut integrity casserait l'add-in a la premiere mise a jour du
      fichier par Microsoft ; l'absence de SRI est donc ici delibere.
    -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- Juste apres office.js : pose le theme avant le premier rendu, sinon le
         volet s'ouvre en clair puis bascule et le clignotement se voit. -->
    <script src="theme.js" data-key="legicite.theme"></script>
    <script src="icons.js"></script>
  </head>

  <body>
    <div id="app">
      <header class="top-bar">
        <div class="top-left">
          <span class="brand"><span class="brand-initial">L</span>égiCite</span>
        </div>
        <div class="top-actions">
          <!-- Libellé identique à celui que pose updateConnectionPill : sans cela,
               le volet afficherait brièvement un autre texte à l'ouverture. -->
          <span id="connection" class="jt-status" title="État de la connexion à Légifrance">À configurer</span>
          <button id="settings" class="icon-btn sm" type="button" title="Réglages"
                  aria-label="Réglages" data-icon="settings" data-icon-size="15"></button>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button class="tab" data-view="search" type="button">Citer</button>
        <button class="tab" data-view="verify" type="button">Vérifier</button>
      </nav>

      <main id="view" class="view"></main>
    </div>

    <div id="toast" class="toast"></div>
  </body>
</html>
